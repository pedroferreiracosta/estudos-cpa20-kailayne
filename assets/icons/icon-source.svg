<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBC1D6"/>
      <stop offset=".45" stop-color="#E07AA6"/>
      <stop offset="1" stop-color="#8A2F6E"/>
    </linearGradient>
    <radialGradient id="glow" cx=".28" cy=".2" r=".7">
      <stop offset="0" stop-color="#fff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="heart" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFE3EE"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D2588F"/>
      <stop offset="1" stop-color="#7A2861"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#5A1745" flood-opacity=".35"/>
    </filter>
    <g id="petals" fill="#fff">
      <ellipse cx="0" cy="-58" rx="30" ry="52"/><ellipse cx="0" cy="58" rx="30" ry="52"/>
      <ellipse cx="-58" cy="0" rx="52" ry="30"/><ellipse cx="58" cy="0" rx="52" ry="30"/>
      <ellipse cx="-41" cy="-41" rx="28" ry="50" transform="rotate(-45 -41 -41)"/><ellipse cx="41" cy="41" rx="28" ry="50" transform="rotate(-45 41 41)"/>
      <ellipse cx="41" cy="-41" rx="28" ry="50" transform="rotate(45 41 -41)"/><ellipse cx="-41" cy="41" rx="28" ry="50" transform="rotate(45 -41 41)"/><circle r="26"/>
    </g>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>
  <!-- flores sutis -->
  <use href="#petals" transform="translate(150 170) scale(1.25)" opacity=".16"/>
  <use href="#petals" transform="translate(905 905) scale(1.6)" opacity=".12"/>
  <!-- coração -->
  <path filter="url(#sh)" fill="url(#heart)" d="M512 838 C 296 700 178 572 178 424 C 178 318 262 238 362 238 C 432 238 486 276 512 334 C 538 276 592 238 662 238 C 762 238 846 318 846 424 C 846 572 728 700 512 838 Z"/>
  <!-- monograma -->
  <text x="496" y="622" text-anchor="middle" font-family="Snell Roundhand" font-style="normal" font-weight="700" font-size="360" fill="url(#ink)">K</text>
  <!-- linha de crescimento -->
  <path d="M352 662 L 430 610 L 492 640 L 600 560 L 672 520" fill="none" stroke="#E7A3C1" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" opacity="0"/>
  <!-- brilhos -->
  <g fill="#FFF7FB">
    <path d="M812 150 Q 820 206 876 214 Q 820 222 812 278 Q 804 222 748 214 Q 804 206 812 150 Z"/>
    <path d="M900 300 Q 904 326 930 330 Q 904 334 900 360 Q 896 334 870 330 Q 896 326 900 300 Z" opacity=".85"/>
    <path d="M168 760 Q 172 788 200 792 Q 172 796 168 824 Q 164 796 136 792 Q 164 788 168 760 Z" opacity=".8"/>
  </g>
</svg>
